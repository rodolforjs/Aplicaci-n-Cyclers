name: cyclers
description: "Cyclers: app de rutas en bicicleta."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^7.0.0
  file_picker: ^10.3.10
  firebase_auth: ^7.0.1
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  google_maps_flutter: ^2.18.1
  google_maps_flutter_platform_interface: ^2.17.0
  google_sign_in: ^7.2.0
  http: ^1.2.0
  pointer_interceptor: ^0.10.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  firebase_storage: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 600
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 500
        - asset: assets/fonts/DMMono-Light.ttf
          weight: 500
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-VariableFont_opsz,wght.ttf
          weight: 500

# splash: fondo = brand500 del tema
flutter_native_splash:
  color: "#5E6D28"
  image: assets/images/isotipo_splash.png
  android_12:
    color: "#5E6D28"
    image: assets/images/isotipo_splash.png
  web: true

# ícono de la app (launcher)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/isotipo_icono.png
  adaptive_icon_background: "#5E6D28"
  adaptive_icon_foreground: assets/images/isotipo_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/isotipo_icono.png
    background_color: "#5E6D28"
    theme_color: "#5E6D28"
